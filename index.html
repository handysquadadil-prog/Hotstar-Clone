<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

    <title>Hotstar Clone</title>
    

    <link rel="stylesheet" href="style.css">

    <link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>

<body>



    <!-- SIDEBAR -->

    <aside class="sidebar">

        <div class="logo">
            ★
        </div>

       <div class="menu">

    <div class="menuItem homeBtn">

        <i class="fa-solid fa-house icon"></i>

        <span class="text">Home</span>

    </div>



    <div class="menuItem searchBtn">

        <i class="fa-solid fa-magnifying-glass icon"></i>

        <span class="text">Search</span>

    </div>



    <div class="menuItem movieBtn">

        <i class="fa-solid fa-film icon"></i>

        <span class="text">Movies</span>

    </div>



    <div class="menuItem sportsBtn">

        <i class="fa-solid fa-futbol icon"></i>

        <span class="text">Sports</span>

    </div>

</div>

    </aside>



    <!-- HERO -->

    <section class="hero">



        <!-- IMAGE -->

        <img class="heroImage">



        <!-- VIDEO -->

        <div class="videoContainer">

            <iframe
                class="heroVideo"
                frameborder="0"
                allow="autoplay"
                allowfullscreen>
            </iframe>

        </div>



        <!-- OVERLAY -->

        <div class="overlay"></div>



        <!-- CONTENT -->

        <div class="heroContent">

            <h1 class="title"></h1>
            <div class="metaInfo"></div>

            <p class="description"></p>

            <button class="watchBtn">
                Watch Now
            </button>

        </div>



        <!-- THUMBNAILS -->

 
        <div class="thumbnailRow"></div>
  

    </section>


<!--MOVIE SECTION SCROLL-->

<section class="tvshows">

    <div class="contentSection">

        <h2 class="sectionTitle">
            New on Hotstar
        </h2>

        <div class="tvrow trendingRow"></div>

    </div>



    <div class="contentSection">

        <h2 class="sectionTitle">
            Popular Movies
        </h2>

        <div class="tvrow popularRow"></div>

    </div>



    <div class="contentSection">

        <h2 class="sectionTitle">
            Top Rated
        </h2>

        <div class="tvrow topRatedRow"></div>

    </div>

    <div class="contentSection">

        <h2 class="sectionTitle">
            Upcoming
        </h2>

        <div class="tvrow upComingRow"></div>

    </div>

</section>




    <div class="previewContainer"></div>
        <script src="script.js"></script>

</body>

</html>
